type Library @model @auth(rules: [{ allow: owner } { allow: public, operations: [read] }]) {
  id: ID!
  name: String!
  beats: [Beat] @connection(keyName: "byLibrary", fields: ["id"])
}

type Beat @model @key(name: "byLibrary", fields: ["libraryID"]) @auth(rules: [{ allow: owner } { allow: public, operations: [read] }]) {
  id: ID!
  libraryID: ID!
  title: String!
  artist: Artist!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime
  thumbnail: S3Object
  audio: BeatFile!
  genre: Genre!
  tags: Tags
  public: Boolean!
  price: Price!
  bpm: Int!
  schedule: String
  split: Split
  free: Boolean
}

type S3Object {
  region: String!
  bucket: String!
  key: String!
}

type BeatFile {
  mp3: S3Object!
  wav: S3Object
  zip: S3Object
}

type Price {
  MP3Price: Int
  WAVPrice: Int
  TrackoutPrice: Int
  UnlimitedPrice: Int
  ExclusivePrice: Int
}

type Genre {
  genre1: String!
  genre2: String!
  genre3: String!
}

type Tags {
  tag1: String!
  tag2: String!
  tag3: String!
}

type Artist {
  artistId: String!
  artistName: String!
}

type Collaborator {
  paypalEmail: String!
  percentage: Int!
}

type Split {
  split1: Collaborator!
  split2: Collaborator
  split3: Collaborator
  split4: Collaborator
}
